
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grup Madan</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #090d1a;
      color: #f4f7ff;
    }

    main {
      max-width: 650px;
      margin: auto;
    }

    .panel {
      background: #11182b;
      border: 1px solid #293652;
      border-radius: 14px;
      padding: 16px;
      margin: 15px 0;
    }

    h1 { color: #63e5ed; }

    input, button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 9px;
      font-size: 15px;
    }

    input {
      background: #090d1a;
      color: white;
      border: 1px solid #293652;
    }

    button {
      border: 0;
      background: #55a6ff;
      color: #071222;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    #messages {
      height: 300px;
      overflow-y: auto;
      background: #090d1a;
      padding: 10px;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }

    .message {
      padding: 9px;
      margin: 8px 0;
      background: #18233b;
      border-radius: 9px;
    }

    small, #status { color: #aab6cf; }
    .hidden { display: none; }
    a { color: #63e5ed; }
    code { overflow-wrap: anywhere; }
  </style>
</head>

<body>
<main>
  <h1>🎮 Grup Madan</h1>
  <p>Tempat berkumpul dan mengobrol bersama komunitas Madan Game Store.</p>

  <section class="panel">
    <p id="account">Belum login.</p>
    <button id="login">Login dengan Google</button>
  </section>

  <section id="groupPanel" class="panel hidden">
    <h2>Buat grup</h2>
    <input id="groupName" maxlength="40"
      placeholder="Nama grup, contoh: Gamer Madan">
    <button id="createGroup">Buat Grup Baru</button>

    <h2>Gabung grup</h2>
    <input id="groupCode" maxlength="40"
      placeholder="Masukkan kode grup">
    <button id="joinGroup">Gabung Grup</button>
    <p id="groupStatus"></p>
  </section>

  <section id="chatPanel" class="panel hidden">
    <h2 id="chatTitle">Chat Grup</h2>
    <p>Kode grup: <code id="currentCode"></code></p>
    <button id="copyCode">Salin Kode Grup</button>

    <div id="messages" aria-live="polite"></div>

    <form id="messageForm">
      <input id="messageText" maxlength="1000"
        placeholder="Tulis pesan..." required>
      <button id="sendButton" type="submit">Kirim Pesan</button>
    </form>

    <button id="leaveGroup">Tutup Chat</button>
  </section>

  <p id="status" role="status">Memuat Firebase...</p>
  <p><a href="index.html">← Kembali ke Madan Game Store</a></p>
</main>

<script type="module" src="groups.js?v=2"></script>
</body>
  </html>
